<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Stack Layers -->
  <rect x="40" y="80" width="120" height="20" rx="5" fill="#2563eb"/>
  <rect x="50" y="60" width="100" height="20" rx="5" fill="#3b82f6"/>
  <rect x="60" y="40" width="80" height="20" rx="5" fill="#60a5fa"/>

  <!-- AI Nodes -->
  <circle cx="100" cy="20" r="6" fill="#10b981"/>
  <circle cx="80" cy="30" r="4" fill="#34d399"/>
  <circle cx="120" cy="30" r="4" fill="#34d399"/>

  <!-- Connecting Lines -->
  <line x1="100" y1="26" x2="100" y2="40" stroke="#10b981" stroke-width="2"/>
  <line x1="80" y1="30" x2="90" y2="40" stroke="#10b981" stroke-width="2"/>
  <line x1="120" y1="30" x2="110" y2="40" stroke="#10b981" stroke-width="2"/>

  <!-- Base Curve -->
  <path d="M30 110 Q100 150 170 110" stroke="#2563eb" stroke-width="4" fill="none"/>

  <!-- Text -->
  <text x="100" y="180" text-anchor="middle" font-size="14" fill="#1f2937" font-family="Arial">
    ANNOTEXIA
  </text>
</svg>